<!DOCTYPE html>
<html lang="en">

<style>

padding:0;
box-sizing:border-box;

body{

background-size:400% 400%;
animation:bg 12s ease infinite;
overflow-x:hidden;

@keyframes bg{

}

section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}

.card{

background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:25px;
padding:35px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);

h1{
font-size:2.2rem;
margin-bottom:20px;
}

p{
font-size:1.1rem;
line-height:1.7;
margin-bottom:20px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
cursor:pointer;
background:#ff4f8b;
color:white;
transition:.3s;

button:hover{

</head>
