<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy National Girlfriend Day ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffd6f6,#cde7ff);
background-size:400% 400%;
animation:bg 12s ease infinite;
overflow-x:hidden;
color:#fff;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}

.card{
width:90%;
max-width:700px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:25px;
padding:35px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
font-size:2.2rem;
margin-bottom:20px;
}

p{
font-size:1.1rem;
line-height:1.7;
margin-bottom:20px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
cursor:pointer;
background:#ff4f8b;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

</style>
</head>

<body>

<section>

<div class="card">

<h1>Happy National Girlfriend Day ❤️</h1>

<p>
Aaj ka din duniya ki sabse pyari girlfriend ke naam...
Aur woh ho tum. ❤️
</p>

<button id="startBtn">
Start Our Surprise 💖
</button>

</div>

</section>
<script>

const btn = document.getElementById("startBtn");

btn.onclick = function(){

document.querySelector(".card").innerHTML = `

<h1>Welcome Baby ❤️</h1>

<p>
I made something special just for you...
Ready to begin our little journey? 🥹💕
</p>

<button id="nextBtn">
Let's Go ❤️
</button>

`;

document.getElementById("nextBtn").onclick=function(){

document.querySelector(".card").innerHTML = `

<h1>🤖 Love AI Scanner</h1>

<p id="scanText">
Initializing...
</p>

<div style="
width:100%;
height:20px;
background:rgba(255,255,255,.3);
border-radius:20px;
overflow:hidden;
margin-top:25px;
">

<div id="bar" style="
width:0%;
height:100%;
background:#ff4f8b;
transition:.8s;
"></div>

</div>

`;
let steps=[
"Connecting to Love Satellite... 🛰️",
"Reading Baby's Smile... 😊",
"Checking Cute Level... 💖",
"Finding Jagat's Heart... ❤️",
"Love Scan Complete... ✨"
];

let i=0;

let timer=setInterval(function(){

document.getElementById("scanText").innerHTML=steps[i];

document.getElementById("bar").style.width=((i+1)*20)+"%";

i++;

if(i==steps.length){

clearInterval(timer);

setTimeout(function(){

alert("Scan Complete ❤️");

},800);

}

},1000);
};

};

</script>
</body>
</html>
